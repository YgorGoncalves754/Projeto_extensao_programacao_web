<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="h1-nome">Nome padrão</h1>
    <label for="nome">Qual nome você deseja ter?</label>
    <input type="text" name="nome" id="nomeipt">
    <button id="botao" onclick="testeDOM()">CLIQUE AQUI</button>
</body>
<script>
    const varGlobal = "global";

    function teste() {
        let   mutavel  = "valor mutável"; // existe apenas no bloco, pode n ter valor inicial
        const imutavel = "valor imutável"; // existe apenas no bloco, obriga valor inicial

        console.log(varGlobal);
    }


    function objetosJs() {
        // Diferente do Java onde objetos nascem de uma classe, em JS objetos são variaveis indendentes com atributos
        const pontoTuristico = {
            nome: "Casa da Mãe Joana",
            descricao: "lugar onde vive uma bela mulher",
            idade_minima: 18,
            aberto: true
        };

        console.log(pontoTuristico.nome);
    }


    function testeDOM() {
        // tudo que vem do DOM (document.get....()) é um objeto, como a referencia n é alterada, const serve
        // com esse objeto retornado, podemos acessar atributos como .value, .textContent
        const nome = document.getElementById("h1-nome");
        const ipt_resposta = document.getElementById("nomeipt").value;

        nome.textContent = ipt_resposta;
    }
</script>
</html>
