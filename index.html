<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/style.css">
    <title>Pontos turísticos em Rio do Sul</title>
</head>
<body>
    <header>
        <nav id="navegacao">
            <div id="espaco">
            </div>
            <ul id="lista_navegacao">
                <li><a href="index.html">Home</a></li>
                <li><a href="avaliar.html">Avaliar</a></li>
                <li><a href="sobre.html">Sobre</a></li>
            </ul>
            <div id="entrar">
                <li><a href="entrar.html">Entrar</a></li>
            </div>
        </nav>
    </header>

    <main>
        <div id="apresentacao">
            <h1>Pontos turísticos em Rio do Sul</h1>
            <h2>Guia interativo</h2>
        </div>
        <button id="botaoComecar" onclick="descerTela()">Iniciar</button>
        <div id="menu-mapa">
            <div id="mapa">
            </div>
                <div id="menu-acoes">
                    <form id="form-cadastro-ponto">
                        <input
                            type="text"
                            id="nome"
                            placeholder="Nome do ponto turístico"
                            maxlength="150"
                            required
                        >

                        <textarea
                            id="descricao"
                            placeholder="Descrição do ponto turístico"
                        ></textarea>

                        <!-- Coordenadas ocultas: continuam disponíveis para o JavaScript -->
                        <input type="hidden" id="latitude">
                        <input type="hidden" id="longitude">

                        <button type="submit">Adicionar</button>
                    </form>
                </div>
        </div>

        <aside id="pontos-cadastrados">
        </aside>
    </main>

    <footer id="rodape">
        <p>&copy 2026 Ygor Gonçalves e Gabriel Koch da Silva. Todos os direitos reservados.</p>
    </footer>

    <script>

    </script>
    <script src="assets/js/map.js"></script>
    <script
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDecZ62iiTMV0Nkm5lS1EMNvAr5R-RMcx8&callback=initMap&v=weekly&libraries=marker"
        async
        defer>
    </script>
</body>
</html>
