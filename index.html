<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/style.css">
    <title>Pontos turísticos em Rio do Sul</title>
</head>
<body>
    <header>
        <nav id="navegacao">
            <div id="espaco">
            </div>
            <ul id="lista_navegacao">
                <li><a href="index.html">Home</a></li>
                <li><a href="sobre.html">Sobre</a></li>
            </ul>
            <div id="entrar"></div>
        </nav>
    </header>

    <main>
        <div id="apresentacao">
            <h1>Pontos turísticos em Rio do Sul</h1>
            <h2>Guia interativo</h2>
        </div>
        <button id="botaoComecar" onclick="descerTela()">Iniciar</button>
        <div id="menu-mapa">
            <div id="area-mapa">
                <div id="mapa">
                </div>

                <!-- Fica ao lado do mapa, com a mesma altura dele -->
                <aside id="pontos-cadastrados">
                </aside>
            </div>
                <div id="menu-acoes">
                    <form id="form-cadastro-ponto">
                        <input
                            type="text"
                            id="nome"
                            placeholder="Nome do ponto turístico"
                            maxlength="150"
                            required
                        >

                        <textarea
                            id="descricao"
                            placeholder="Descrição do ponto turístico"
                        ></textarea>

                        <!-- Preenchidos automaticamente ao clicar no mapa -->
                        <input type="text" id="latitude" placeholder="Latitude (clique no mapa)" readonly hidden>
                        <input type="text" id="longitude" placeholder="Longitude (clique no mapa)" readonly hidden>

                        <button type="submit">Adicionar</button>
                    </form>
                </div>
        </div>
    </main>

    <footer id="rodape">
        <p>&copy 2026 Ygor Gonçalves e Gabriel Koch da Silva. Todos os direitos reservados.</p>
    </footer>

    <script>
        // função que interrompe a rolagem em andamento.
        let cancelarDescida = null;

        // Desce lentamente até o mapa quando o botão "Iniciar" é clicado.
        function descerTela() {
            const DURACAO_MS = 2000; // quanto maior, mais lenta a descida

            const destino = document.getElementById("menu-mapa");
            if (!destino) {
                return;
            }

            // Se já havia uma rolagem em andamento, interrompe antes de começar outra.
            if (cancelarDescida) {
                cancelarDescida();
            }

            const inicio = window.scrollY;
            const limiteDaPagina = document.documentElement.scrollHeight - window.innerHeight;

            // Posição que deixa o bloco do mapa centralizado na tela,
            // sem passar do início nem do fim da página.
            const centralizado = destino.getBoundingClientRect().top + inicio
                - (window.innerHeight - destino.offsetHeight) / 2;
            const fim = Math.min(Math.max(centralizado, 0), limiteDaPagina);
            const distancia = fim - inicio;

            if (Math.abs(distancia) < 1) {
                return;
            }

            // Começa devagar, acelera no meio e desacelera ao chegar.
            function suavizar(t) {
                return t < 0.5
                    ? 4 * t * t * t
                    : 1 - Math.pow(-2 * t + 2, 3) / 2;
            }

            let idAnimacao = null;
            let tempoInicial = null;
            const eventosDoUsuario = ["wheel", "touchstart", "mousedown", "keydown"];

            function cancelar() {
                cancelAnimationFrame(idAnimacao);
                eventosDoUsuario.forEach(function (evento) {
                    window.removeEventListener(evento, cancelar);
                });
                cancelarDescida = null;
            }

            function passo(agora) {
                if (tempoInicial === null) {
                    tempoInicial = agora;
                }

                const progresso = Math.min((agora - tempoInicial) / DURACAO_MS, 1);
                window.scrollTo(0, inicio + distancia * suavizar(progresso));

                if (progresso < 1) {
                    idAnimacao = requestAnimationFrame(passo);
                } else {
                    cancelar();
                }
            }

            // Se o usuário rolar/tocar/digitar durante a descida, ele retoma o controle.
            eventosDoUsuario.forEach(function (evento) {
                window.addEventListener(evento, cancelar, { passive: true });
            });
            cancelarDescida = cancelar;

            idAnimacao = requestAnimationFrame(passo);
        }
    </script>
    <script src="assets/js/map.js"></script>
    <script
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDecZ62iiTMV0Nkm5lS1EMNvAr5R-RMcx8&callback=initMap&v=weekly&libraries=marker"
        async
        defer>
    </script>
</body>
</html>
